 const g=$("g").value,c=$("c").value,d=$("d").value,run=+$("run").value||1,q=$("q").value.trim().toLowerCase();
 const nh=Object.keys(hid).filter(i=>byId[i]).length;
 let L=S.filter(s=>(showHid||!hid[s.id])&&(!g||s.groups.includes(g))&&(!c||s.city==c)&&(!d||s.district==d)&&s.rate!=null&&s.rate>rng[0]&&s.rate<=rng[1]&&s.best_run>=run&&(!q||(s.name+s.short+s.id).toLowerCase().includes(q)));
 L.sort((a,b)=>{let x=a[sortK],y=b[sortK];if(sortK=="city"){x=cityRank(a.city);y=cityRank(b.city)}
  const r=(x>y?1:x<y?-1:0)*sortD;return r||b.rate-a.rate||cityRank(a.city)-cityRank(b.city)||a.short.localeCompare(b.short)});
 const unm=L.filter(s=>!s.mapped).length;
 $("cnt").textContent=`${L.length} 個版位`+(unm?`　（${unm} 個地區尚未歸組）`:"");
 $("hv").textContent=nh?(showHid?"返回":`顯示已隱藏（${nh}）`):"";
 $("tb").innerHTML=L.slice(0,400).map(s=>`<tr class="r${pick[s.id]?" sel":""}${hid[s.id]?" hid":""}" data-i="${s.id}">
 <td><input type="checkbox" class="ck" data-i="${s.id}" ${pick[s.id]?"checked":""}></td>
 <td class="nmc"><div class="nm">${s.short}</div><span class="full">${s.name}</span></td>
 <td>${s.city}${s.district?" "+s.district:`<span class="tag">縣市型</span>`}</td>
 <td class="n"><span class="rate">${pct(s.rate)}</span><small class="dim">${s.num}/${s.den}</small><div class="bar2"><i style="width:${Math.min(100,s.rate*100)}%"></i></div></td>
 <td class="n">${s.best_run} 天${s.best_run_cap>1?`<span class="dim"> ×${s.best_run_cap}</span>`:""}</td><td class="dim">${s.sellable_from.slice(5).replace("-","/")}</td>
 <td class="n">${s.price.toLocaleString()}${s.price_src!="價目表"?`<span class="tag" title="價目表查無，暫用 DOS 牌價">DOS</span>`:""}</td>
 <td class="n dim">${s.p55.toLocaleString()}</td><td class="n dim">${s.p6.toLocaleString()}</td>
 <td>${hid[s.id]?`<button class="btn" data-un="${s.id}">還原</button>`:`<button class="btn" data-hd="${s.id}">隱藏</button>`}</td></tr>
 ${open==s.id?detail(s):""}`).join("")+(L.length>400?`<tr><td colspan=10 class="dim">僅顯示前 400 筆，請縮小篩選</td></tr>`:"");
}
function detail(s){
 const cells=s.free.map((f,i)=>{const dt=new Date(M.w0+"T00:00:00");dt.setDate(dt.getDate()+i);
  return `<i class="${f>=s.cap?"f":f>0?"p":""}" title="${dt.getMonth()+1}/${dt.getDate()}　餘 ${f}/${s.cap}"></i>`}).join("");
 const wk=[0,1,2,3].map(w=>{const a=s.free.slice(w*7,w*7+7);return `第 ${w+1} 週 最小餘量 ${Math.min(...a)}／${s.cap}`}).join("</div><div>");
 const same=S.filter(x=>x.name==s.name).length;
 return `<tr class="det"><td></td><td colspan=9><b>${s.name}</b>　ID ${s.id}　${s.channel}　歸屬 ${s.groups.join("、")||"未歸組"}
 <div class="strip">${cells}</div>綠＝全部輪次可售　橘＝部分可售　灰＝已滿或非售期
 <div class="wk"><div>${wk}</div></div>
 <div style="margin-top:8px"><button class="btn" data-hdname="${s.id}">隱藏全部「${s.short}」（${same} 個）</button></div></td></tr>`}
const dz=v=>{v=parseFloat(v);if(!(v>0))return null;return v<=10?v/10:v/100};
function tray(){
 const ids=Object.keys(pick).filter(i=>byId[i]);$("tray").classList.toggle("on",ids.length>0);
 const gd=dz($("gd").value);let L=0,T=0;
 $("tt").innerHTML=ids.map(i=>{const s=byId[i],p=pick[i],d=dz(p.d)??gd,q=+p.q||1;
  const u=d==null?null:Math.round(s.price*d),sub=u==null?null:u*q;L+=s.price*q;if(sub!=null)T+=sub;
  return `<tr><td><b style="font-weight:500">${s.short}</b></td><td>${s.city}${s.district||""}</td><td class="n">${s.price.toLocaleString()}</td>
  <td class="n"><input data-i="${i}" data-f="d" value="${p.d||""}" placeholder="${$("gd").value}"></td><td class="n"><input data-i="${i}" data-f="q" value="${q}"></td>
  <td class="n">${u==null?"—":u.toLocaleString()}</td><td class="n"><b style="font-weight:500">${sub==null?"—":sub.toLocaleString()}</b></td><td class="x" data-rm="${i}">✕</td></tr>`}).join("");
 $("sl").textContent=L.toLocaleString();$("ss").textContent=T.toLocaleString();$("sd").textContent=L?(T/L*10).toFixed(2)+" 折":"—";}
$("gd").oninput=tray;
$("tt").oninput=e=>{const i=e.target.dataset.i;if(!i)return;pick[i][e.target.dataset.f]=e.target.value;store.set("idle_pick_v1",pick);
 const f=e.target.dataset.f;tray();const n=$("tt").querySelector(`input[data-i="${i}"][data-f="${f}"]`);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
$("tt").onclick=e=>{const i=e.target.dataset.rm;if(!i)return;delete pick[i];store.set("idle_pick_v1",pick);tray();draw()};
$("tb").onchange=e=>{const c=e.target.closest(".ck");if(!c)return;const i=c.dataset.i;if(c.checked)pick[i]={d:"",q:1};else delete pick[i];store.set("idle_pick_v1",pick);tray();c.closest("tr").classList.toggle("sel",c.checked)};
$("tb").onclick=e=>{const t=e.target;
 if(t.dataset.hd){hid[t.dataset.hd]=1;store.set("idle_hide_v1",hid);return draw()}
 if(t.dataset.un){delete hid[t.dataset.un];store.set("idle_hide_v1",hid);return draw()}
 if(t.dataset.hdname){const n=byId[t.dataset.hdname].name;S.filter(x=>x.name==n).forEach(x=>hid[x.id]=1);store.set("idle_hide_v1",hid);open=null;return draw()}
 if(t.closest(".ck"))return;const r=t.closest("tr.r");if(!r)return;open=open==r.dataset.i?null:+r.dataset.i;draw()};
$("hv").onclick=()=>{showHid=!showHid;draw()};
$("c").onchange=()=>{upDist();draw()};["g","d","run","q"].forEach(i=>$(i).oninput=draw);
draw();tray();
// 日期
const WD="日一二三四五六",fd=d=>`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`,pd=x=>new Date(x+"T00:00:00");
const today=new Date(),sn=pd(M.snapshot),w0=pd(M.w0),w1=pd(M.w1),ex1=new Date(w0);ex1.setDate(ex1.getDate()-1);
$("dates").innerHTML=`<div><small>今天</small><b>${fd(today)}</b></div><div class="on"><small>觀察期　往後四週・共 28 天</small><b>${fd(w0)} ～ ${fd(w1)}</b></div><div><small>快照當週・不計入</small><b>${fd(sn)} ～ ${fd(ex1)}</b></div>`;
if(M.demo)$("demo").hidden=false;
// 說明
const E=M.excluded||{},un=[...new Set(Object.keys(M.unlimited_names||{}))];
$("excb").innerHTML=`<ul>
<li>僅依<b>已簽約</b>資料計算；報價單、預留、鎖檔尚未納入，「可售」皆為候選空檔，報價前請以 DOS 最新庫存確認。</li>
<li>牌價以價目表為準；價目表查無者暫用 DOS 牌價，標「DOS」。</li>
<li>已排除　已停售版位 <b>${E["已停售(sale_status=0)"]||0}</b> 個（591 歷年累計）</li>
<li>已排除　無輪替限制（輪替 ≥100，價目表輪替/固定為「—」）<b>${E["無輪替限制(輪替≥100)"]||0}</b> 個：${un.slice(0,10).join("、")}…</li>
<li>已排除　指定排除 <b>${Object.entries(E).filter(([k])=>k.startsWith("指定排除")).reduce((a,[,v])=>a+v,0)}</b> 個：${M.exclude_names.join("、")}</li>
<li>已排除　觀察期內不在售期間 <b>${E["觀察期內不在售期間"]||0}</b> 個</li>
<li>你自己隱藏的版位可在列表上方「顯示已隱藏」還原。</li></ul>`;
</script></body></html>
